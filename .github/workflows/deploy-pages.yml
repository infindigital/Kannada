name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - claude/kannada-culture-hero-section-ri0x3l
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish the static site. The WordPress plugin source and dev files
      # are excluded from the published output.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp -r index.html about.html leaders.html media.html programs.html movements.html admin.html assets README.md _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
