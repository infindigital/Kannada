<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Illuminated palace at night">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0300"/>
      <stop offset="0.6" stop-color="#26090A"/>
      <stop offset="1" stop-color="#3A0D10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.68" r="0.55">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vig2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0300" stop-opacity="0.6"/>
      <stop offset="0.42" stop-color="#0D0300" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#night)"/>
  <rect width="1200" height="750" fill="url(#halo)"/>

  <!-- palace silhouette -->
  <g fill="#1A0603">
    <rect x="150" y="470" width="900" height="180"/>
    <rect x="330" y="400" width="540" height="80"/>
    <!-- domes -->
    <path d="M600 250c60 0 96 44 96 92H504c0-48 36-92 96-92z"/>
    <rect x="592" y="196" width="16" height="58"/>
    <circle cx="600" cy="190" r="14"/>
    <path d="M340 340c40 0 64 30 64 62h-128c0-32 24-62 64-62z"/>
    <path d="M860 340c40 0 64 30 64 62H796c0-32 24-62 64-62z"/>
    <!-- corner towers -->
    <rect x="150" y="382" width="86" height="270"/>
    <rect x="964" y="382" width="86" height="270"/>
    <path d="M193 330l50 54h-100z"/>
    <path d="M1007 330l50 54h-100z"/>
  </g>

  <!-- arched windows -->
  <g fill="#F5A623" opacity="0.22">
    <path d="M400 560a22 22 0 0144 0v70h-44z"/>
    <path d="M500 560a22 22 0 0144 0v70h-44z"/>
    <path d="M600 560a22 22 0 0144 0v70h-44z"/>
    <path d="M700 560a22 22 0 0144 0v70h-44z"/>
    <path d="M800 560a22 22 0 0144 0v70h-44z"/>
  </g>

  <!-- strings of lights -->
  <g fill="#F5A623">
    <g id="row1">
      <circle cx="160" cy="472" r="5"/><circle cx="205" cy="472" r="5"/><circle cx="250" cy="472" r="5"/>
      <circle cx="295" cy="472" r="5"/><circle cx="340" cy="472" r="5"/><circle cx="385" cy="472" r="5"/>
      <circle cx="430" cy="472" r="5"/><circle cx="475" cy="472" r="5"/><circle cx="520" cy="472" r="5"/>
      <circle cx="565" cy="472" r="5"/><circle cx="610" cy="472" r="5"/><circle cx="655" cy="472" r="5"/>
      <circle cx="700" cy="472" r="5"/><circle cx="745" cy="472" r="5"/><circle cx="790" cy="472" r="5"/>
      <circle cx="835" cy="472" r="5"/><circle cx="880" cy="472" r="5"/><circle cx="925" cy="472" r="5"/>
      <circle cx="970" cy="472" r="5"/><circle cx="1015" cy="472" r="5"/>
    </g>
    <g opacity="0.9">
      <circle cx="340" cy="402" r="4.5"/><circle cx="395" cy="402" r="4.5"/><circle cx="450" cy="402" r="4.5"/>
      <circle cx="505" cy="402" r="4.5"/><circle cx="560" cy="402" r="4.5"/><circle cx="615" cy="402" r="4.5"/>
      <circle cx="670" cy="402" r="4.5"/><circle cx="725" cy="402" r="4.5"/><circle cx="780" cy="402" r="4.5"/>
      <circle cx="835" cy="402" r="4.5"/>
    </g>
    <g opacity="0.8">
      <circle cx="530" cy="344" r="4"/><circle cx="565" cy="342" r="4"/><circle cx="600" cy="341" r="4"/>
      <circle cx="635" cy="342" r="4"/><circle cx="670" cy="344" r="4"/>
    </g>
  </g>

  <rect x="0" y="650" width="1200" height="100" fill="#120402"/>
  <rect width="1200" height="750" fill="url(#vig2)"/>
