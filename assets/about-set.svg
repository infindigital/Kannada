<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Film crew on set with camera and lighting">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160500"/>
      <stop offset="1" stop-color="#330B0C"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#sbg)"/>

  <!-- light beam -->
  <polygon points="120,120 470,40 470,330 120,190" fill="url(#beam)"/>

  <!-- softbox + stand -->
  <g fill="#0F0300">
    <rect x="60" y="96" width="66" height="96" rx="4"/>
    <rect x="88" y="192" width="8" height="150"/>
    <path d="M52 344h84l-42-14z"/>
    <rect x="56" y="340" width="76" height="8" rx="4"/>
  </g>
  <rect x="118" y="104" width="8" height="80" fill="#F5A623" opacity="0.85"/>

  <!-- camera + tripod -->
  <g fill="#0F0300">
    <rect x="560" y="150" width="120" height="66" rx="6"/>
    <rect x="676" y="168" width="40" height="30" rx="4"/>
    <circle cx="592" cy="140" r="22"/>
    <circle cx="640" cy="140" r="22"/>
    <path d="M618 216l-46 130h14l40-112 40 112h14z"/>
    <rect x="612" y="216" width="12" height="40"/>
  </g>
  <circle cx="700" cy="183" r="7" fill="#C8102E"/>

  <!-- boom mic -->
  <g fill="#0F0300">
    <rect x="300" y="60" width="180" height="7" rx="3.5" transform="rotate(-12 300 60)"/>
    <rect x="292" y="46" width="46" height="12" rx="6" transform="rotate(-12 292 46)"/>
  </g>

  <!-- two figures -->
  <g fill="#0B0200">
    <circle cx="380" cy="196" r="26"/>
    <path d="M340 346c0-46 18-118 40-118s40 72 40 118z"/>
    <circle cx="470" cy="214" r="22"/>
    <path d="M436 346c0-40 14-102 34-102s34 62 34 102z"/>
  </g>

  <!-- floor -->
  <rect x="0" y="344" width="800" height="56" fill="#0B0200"/>
  <rect x="0" y="344" width="800" height="2" fill="#F5A623" opacity="0.3"/>
</svg>
