<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Cinema screen and rows of seats">
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A0D10"/>
      <stop offset="1" stop-color="#110300"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCC00"/>
      <stop offset="1" stop-color="#D42A28"/>
    </linearGradient>
    <linearGradient id="proj" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#FFCC00" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFCC00" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#hall)"/>

  <!-- projection cone -->
  <polygon points="200,400 44,60 356,60" fill="url(#proj)"/>

  <!-- screen -->
  <rect x="44" y="52" width="312" height="176" rx="4" fill="url(#scr)" opacity="0.92"/>
  <rect x="44" y="52" width="312" height="176" rx="4" fill="none" stroke="#1A0800" stroke-width="6" opacity="0.35"/>

  <!-- seat rows -->
  <g fill="#0A0200">
    <g>
      <rect x="20" y="268" width="52" height="34" rx="10"/>
      <rect x="88" y="268" width="52" height="34" rx="10"/>
      <rect x="156" y="268" width="52" height="34" rx="10"/>
      <rect x="224" y="268" width="52" height="34" rx="10"/>
      <rect x="292" y="268" width="52" height="34" rx="10"/>
    </g>
    <g>
      <rect x="-6" y="322" width="60" height="40" rx="12"/>
      <rect x="70" y="322" width="60" height="40" rx="12"/>
      <rect x="146" y="322" width="60" height="40" rx="12"/>
      <rect x="222" y="322" width="60" height="40" rx="12"/>
      <rect x="298" y="322" width="60" height="40" rx="12"/>
    </g>
    <rect x="0" y="376" width="400" height="24"/>
  </g>
</svg>
