<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" role="img" aria-label="Camera viewfinder with rule-of-thirds grid and aperture">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A0800"/>
      <stop offset="0.55" stop-color="#2A0A06"/>
      <stop offset="1" stop-color="#4A0D14"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#C8102E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C8102E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="800" fill="url(#fbg)"/>
  <rect width="900" height="800" fill="url(#fglow)"/>

  <!-- rule of thirds -->
  <g stroke="#F5A623" stroke-width="1.5" opacity="0.28">
    <line x1="300" y1="80" x2="300" y2="720"/>
    <line x1="600" y1="80" x2="600" y2="720"/>
    <line x1="80" y1="293" x2="820" y2="293"/>
    <line x1="80" y1="507" x2="820" y2="507"/>
  </g>

  <!-- intersection marks -->
  <g fill="#F5A623" opacity="0.7">
    <circle cx="300" cy="293" r="4"/><circle cx="600" cy="293" r="4"/>
    <circle cx="300" cy="507" r="4"/><circle cx="600" cy="507" r="4"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.85">
    <path d="M80 150V80h70"/>
    <path d="M820 150V80h-70"/>
    <path d="M80 650v70h70"/>
    <path d="M820 650v70h-70"/>
  </g>

  <!-- aperture blades -->
  <g transform="translate(450 400)">
    <circle r="152" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.35"/>
    <g fill="#C8102E" opacity="0.9">
      <path d="M0 -140 L121 -70 L86 -50 L-35 -120 Z" transform="rotate(0)"/>
      <path d="M0 -140 L121 -70 L86 -50 L-35 -120 Z" transform="rotate(60)"/>
      <path d="M0 -140 L121 -70 L86 -50 L-35 -120 Z" transform="rotate(120)"/>
      <path d="M0 -140 L121 -70 L86 -50 L-35 -120 Z" transform="rotate(180)"/>
      <path d="M0 -140 L121 -70 L86 -50 L-35 -120 Z" transform="rotate(240)"/>
      <path d="M0 -140 L121 -70 L86 -50 L-35 -120 Z" transform="rotate(300)"/>
    </g>
    <circle r="46" fill="#F5A623"/>
    <circle r="46" fill="none" stroke="#1A0800" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- focus ticks -->
  <g stroke="#FFFFFF" stroke-width="3" opacity="0.5">
    <line x1="450" y1="80" x2="450" y2="112"/>
    <line x1="450" y1="688" x2="450" y2="720"/>
    <line x1="80" y1="400" x2="112" y2="400"/>
    <line x1="788" y1="400" x2="820" y2="400"/>
  </g>
</svg>
