<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Raised fists and Kannada flags">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#3A0D10"/>
      <stop offset="0.55" stop-color="#A02318"/>
      <stop offset="1"   stop-color="#160402"/>
    </linearGradient>
    <radialGradient id="uglow" cx="0.5" cy="0.46" r="0.48">
      <stop offset="0" stop-color="#FFCC00" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFCC00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#ubg)"/>
  <rect width="400" height="400" fill="url(#uglow)"/>

  <!-- the flags stand behind the arms so the silhouettes stay unbroken -->
  <g>
    <g transform="rotate(-6 200 400)">
      <rect x="128" y="40" width="6" height="120" fill="#150402"/>
      <path d="M134 43l64 19-64 19z" fill="#FFCC00"/>
    </g>
    <g transform="rotate(7 200 400)">
      <rect x="258" y="26" width="6" height="130" fill="#150402"/>
      <path d="M264 29l62 18-62 18z" fill="#D42A28"/>
    </g>
  </g>

  <!-- three raised arms: forearm, then a fist wider than it, with knuckles -->
  <g fill="#150402">
    <g transform="rotate(-15 200 400)">
      <rect x="82" y="212" width="36" height="196" rx="18"/>
      <rect x="72" y="168" width="56" height="56" rx="20"/>
      <rect x="80" y="180" width="40" height="4" rx="2" fill="#3A0D10"/>
      <rect x="80" y="192" width="40" height="4" rx="2" fill="#3A0D10"/>
    </g>
    <g>
      <rect x="182" y="186" width="38" height="222" rx="19"/>
      <rect x="171" y="138" width="60" height="60" rx="22"/>
      <rect x="180" y="151" width="42" height="4" rx="2" fill="#3A0D10"/>
      <rect x="180" y="164" width="42" height="4" rx="2" fill="#3A0D10"/>
    </g>
    <g transform="rotate(16 200 400)">
      <rect x="284" y="216" width="36" height="192" rx="18"/>
      <rect x="274" y="172" width="56" height="56" rx="20"/>
      <rect x="282" y="184" width="40" height="4" rx="2" fill="#3A0D10"/>
      <rect x="282" y="196" width="40" height="4" rx="2" fill="#3A0D10"/>
    </g>
  </g>
</svg>
