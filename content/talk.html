            <p>
              ಕನ್ನಡ ನಮ್ಮ ಉಸಿರು. ಈ ನೆಲದ ಭಾಷೆ, ನೀರು ಮತ್ತು ಬದುಕು — ಇವು ಮೂರೂ
              ಒಂದೇ ಹೋರಾಟದ ಭಾಗ.
            </p>
            <p>
              ಕನ್ನಡಿಗರ ಸ್ವಾಭಿಮಾನವನ್ನು ಎತ್ತಿ ಹಿಡಿಯುವುದು, ಈ ನಾಡಿನ ಯುವಕರಿಗೆ
              ಇಲ್ಲಿಯೇ ಬದುಕು ಕಟ್ಟಿಕೊಳ್ಳುವ ದಾರಿ ತೋರಿಸುವುದು — ಅದೇ ನಮ್ಮ ಮೊದಲ
              ಮತ್ತು ಕೊನೆಯ ಕೆಲಸ.
            </p>
