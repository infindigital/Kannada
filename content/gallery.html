  <!-- ================= ಚಿತ್ರ ಸಂಗ್ರಹ ================= -->
  <section class="gal" id="gallery">
    <div class="wrap">

      <div class="section-head">
        <p class="eyebrow">ಫೋಟೊಗಳು</p>
        <h2>ಚಿತ್ರ ಸಂಗ್ರಹ</h2>
        <p class="lede">ಸಮಾವೇಶಗಳು, ಪ್ರತಿಭಟನೆಗಳು ಮತ್ತು ಸಂಘಟನೆಯ ಕ್ಷಣಗಳು.</p>
      </div>

      <!-- TODO: the pictures are page artwork and the captions are
           PLACEHOLDERS. Swap in photographs; the mosaic spans are set by the
           is-wide / is-tall classes. -->
      <div class="gal-grid">
        <button class="gal-item is-wide is-tall" type="button" data-index="0"
                data-full="assets/gal-jatre.svg" data-caption="ನಾಡಹಬ್ಬದ ಮೆರವಣಿಗೆ">
          <img src="assets/gal-jatre.svg" alt="ಬಾವುಟಗಳೊಂದಿಗೆ ರಥೋತ್ಸವದ ಮೆರವಣಿಗೆ" width="900" height="600"
               loading="lazy" decoding="async" />
          <span class="gal-cap">ನಾಡಹಬ್ಬದ ಮೆರವಣಿಗೆ</span>
        </button>
        <button class="gal-item " type="button" data-index="1"
                data-full="assets/about-rally.svg" data-caption="ಬೆಂಗಳೂರಿನ ಸಮಾವೇಶ">
          <img src="assets/about-rally.svg" alt="ಬಾವುಟ ಹಿಡಿದ ಜನಸಮೂಹ" width="900" height="600"
               loading="lazy" decoding="async" />
          <span class="gal-cap">ಬೆಂಗಳೂರಿನ ಸಮಾವೇಶ</span>
        </button>
        <button class="gal-item " type="button" data-index="2"
                data-full="assets/gal-school.svg" data-caption="ಕನ್ನಡ ಶಾಲೆಯಲ್ಲಿ ಧ್ವಜಾರೋಹಣ">
          <img src="assets/gal-school.svg" alt="ಬಾವುಟದೊಂದಿಗೆ ಶಾಲೆಯ ಕಟ್ಟಡ" width="900" height="600"
               loading="lazy" decoding="async" />
          <span class="gal-cap">ಕನ್ನಡ ಶಾಲೆಯಲ್ಲಿ ಧ್ವಜಾರೋಹಣ</span>
        </button>
        <button class="gal-item is-wide" type="button" data-index="3"
                data-full="assets/gal-vidhana.svg" data-caption="ವಿಧಾನಸೌಧದ ಮುಂದೆ">
          <img src="assets/gal-vidhana.svg" alt="ಸಂಜೆ ಬೆಳಗುವ ಸರ್ಕಾರಿ ಕಟ್ಟಡ" width="900" height="600"
               loading="lazy" decoding="async" />
          <span class="gal-cap">ವಿಧಾನಸೌಧದ ಮುಂದೆ</span>
        </button>
        <button class="gal-item " type="button" data-index="4"
                data-full="assets/page-hampi.svg" data-caption="ಹಂಪಿ — ನಮ್ಮ ಪರಂಪರೆ">
          <img src="assets/page-hampi.svg" alt="ಹಂಪಿಯ ಕಲ್ಲಿನ ಕಂಬಗಳ ಸಾಲು" width="900" height="600"
               loading="lazy" decoding="async" />
          <span class="gal-cap">ಹಂಪಿ — ನಮ್ಮ ಪರಂಪರೆ</span>
        </button>
        <button class="gal-item " type="button" data-index="5"
                data-full="assets/about-unity.svg" data-caption="ಒಗ್ಗಟ್ಟಿನ ಪ್ರತಿಜ್ಞೆ">
          <img src="assets/about-unity.svg" alt="ಬಾವುಟಗಳೊಂದಿಗೆ ಎತ್ತಿ ಹಿಡಿದ ಕೈಗಳು" width="900" height="600"
               loading="lazy" decoding="async" />
          <span class="gal-cap">ಒಗ್ಗಟ್ಟಿನ ಪ್ರತಿಜ್ಞೆ</span>
        </button>
        <button class="gal-item is-wide" type="button" data-index="6"
                data-full="assets/page-mysore.svg" data-caption="ಮೈಸೂರು ದಸರಾ">
          <img src="assets/page-mysore.svg" alt="ದೀಪಗಳಿಂದ ಬೆಳಗುವ ಅರಮನೆ" width="900" height="600"
               loading="lazy" decoding="async" />
          <span class="gal-cap">ಮೈಸೂರು ದಸರಾ</span>
        </button>
      </div>
    </div>

    <dialog class="lb" id="lightbox" aria-label="ಚಿತ್ರ">
      <button class="lb-btn lb-close" type="button" id="lbClose" aria-label="ಮುಚ್ಚಿ">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M1 1l16 16M17 1L1 17" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
      <img id="lbImage" alt="" />
      <div class="lb-bar">
        <button class="lb-btn lb-prev" type="button" id="lbPrev" aria-label="ಹಿಂದಿನ ಚಿತ್ರ">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="lb-cap" id="lbCap"></p>
        <p class="lb-count" id="lbCount"></p>
        <button class="lb-btn lb-next" type="button" id="lbNext" aria-label="ಮುಂದಿನ ಚಿತ್ರ">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </dialog>
  </section>
