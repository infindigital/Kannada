  <!-- ================= HERO — full-bleed video + book slider ================= -->
  <section class="hero" id="hero">

      </article>

      <article class="hero-slide" aria-roledescription="ಪುಟ" aria-label="2 / 3"

      </article>

      <article class="hero-slide" aria-roledescription="ಪುಟ" aria-label="3 / 3"

             src="assets/page-mysore.svg" />

    <div class="hero-scrim" aria-hidden="true"></div>

    <div class="hero-inner">
      <div class="wrap">
      <div class="hero-copy">
        <p class="eyebrow">ಕರ್ನಾಟಕ ರಕ್ಷಣಾ ವೇದಿಕೆ</p>

        <h1 class="hero-title">

        <p class="hero-lede">
          ನಾಡು, ನುಡಿ, ನೆಲ, ಸಂಸ್ಕೃತಿ ಮತ್ತು ಕನ್ನಡಿಗರ ಹಕ್ಕುಗಳ ರಕ್ಷಣೆಗಾಗಿ

                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>
      </div>
    </div>

    <div class="wrap hero-bar">
      <div class="hero-caption">
        <p class="chapter" id="heroChapter">01</p>
        <p class="title" id="heroTitle">ಕನ್ನಡ ಬಾವುಟ</p>

      <div class="book-controls">
        <p class="book-count" aria-hidden="true">
          <span id="bookCurrent">01</span><span class="total"> / 03</span>
        </p>

        <ul class="book-bars" id="bookBars">

          </button></li>
          <li><button class="book-bar" type="button" data-index="1" aria-current="false">
            <span></span><span class="sr-only">ಪುಟ 2</span>
          </button></li>
          <li><button class="book-bar" type="button" data-index="2" aria-current="false">

              <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
