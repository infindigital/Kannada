<!DOCTYPE html>
<html class="h-full" lang="kn">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Craft — ಸಿನಿಮ್ಯಾಟಿಕ್ ಕೋರ್ಸ್</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for Typography (incl. Kannada) -->
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;700&family=Noto+Sans+Kannada:wght@300;400;700&family=Noto+Serif+Kannada:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif Kannada"', '"Instrument Serif"', 'serif'],
            sans: ['"Noto Sans Kannada"', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              orange: '#FF7A00',
              dark: '#0A0A0A',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-typography">
    /* Custom outline text for the second word */
    .text-outline {
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.8);
      font-weight: 400;
    }
    /* Large numbers styling */
    .big-number-accent {
      color: transparent;
      -webkit-text-stroke: 1px #FF7A00;
    }
    .big-number-muted {
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
    }
    .letter-spacing-widest {
      letter-spacing: 0.2em;
    }
  </style>
<style data-purpose="layout-and-effects">
    /* Full-bleed background video of the Karnataka flag */
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    /* Cinematic darkening overlay so the text stays legible over the video */
    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(10, 10, 10, 0.88) 0%, rgba(10, 10, 10, 0.55) 45%, rgba(10, 10, 10, 0.25) 100%),
        linear-gradient(0deg, rgba(10, 10, 10, 0.75) 0%, rgba(10, 10, 10, 0.15) 40%, rgba(10, 10, 10, 0.35) 100%);
    }
    .glass-button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    .glass-button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .glow-orange {
      box-shadow: 0 0 20px rgba(255, 122, 0, 0.4);
    }
    /* Vertical line accent for the course label */
    .accent-line::before {
      content: "";
      display: inline-block;
      width: 30px;
      height: 1px;
      background-color: #FF7A00;
      vertical-align: middle;
      margin-right: 12px;
    }
  </style>
</head>
<body class="h-full m-0 p-0 bg-brand-dark text-white font-sans overflow-hidden">
<!-- BEGIN: MainContainer -->
<main class="relative h-full w-full flex flex-col justify-between p-8 md:p-12">
<!-- BEGIN: Background Video (Karnataka flag flying) -->
<video class="hero-video" autoplay muted loop playsinline data-purpose="hero-background-video">
<source src="assets/karnataka-flag.mp4" type="video/mp4" />
</video>
<div class="hero-overlay" aria-hidden="true"></div>
<!-- END: Background Video -->
<!-- BEGIN: Header -->
<header class="flex items-center justify-between z-10">
<!-- Hamburger Menu -->
<div class="cursor-pointer" data-purpose="navigation-menu">
<svg fill="none" height="14" viewbox="0 0 24 14" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M0 1H24" stroke="white" stroke-width="1.5"></path>
<path d="M0 7H16" stroke="white" stroke-width="1.5"></path>
<path d="M0 13H24" stroke="white" stroke-width="1.5"></path>
</svg>
</div>
<!-- Logo -->
<div class="flex items-center gap-3" data-purpose="brand-logo">
<div class="w-8 h-8 border-2 border-brand-orange flex items-center justify-center">
<div class="w-3 h-3 bg-brand-orange"></div>
</div>
<span class="text-xl font-bold tracking-[0.3em] uppercase">Craft</span>
</div>
<!-- Auth Actions -->
<div class="flex items-center gap-8" data-purpose="auth-links">
<a class="text-xs font-semibold tracking-widest hover:text-brand-orange transition-colors" href="#">ಲಾಗಿನ್</a>
<a class="glass-button px-6 py-2 rounded-full text-xs font-semibold tracking-widest border border-white/20" href="#">ಪ್ರವೇಶ ಪಡೆಯಿರಿ</a>
</div>
</header>
<!-- END: Header -->
<!-- BEGIN: HeroContent -->
<section class="flex-grow flex items-center relative z-10">
<!-- Left Content -->
<div class="max-w-xl z-10">
<div class="accent-line text-[10px] uppercase tracking-[0.2em] text-brand-orange mb-8 font-semibold">
          ಕೋರ್ಸ್ 03 · ಚಲನಚಿತ್ರ &amp; ನಿರ್ದೇಶನ
        </div>
<h1 class="font-serif leading-none mb-10">
<span class="block text-[88px] md:text-[150px]">ಸಿನಿಮ್ಯಾ-</span>
<span class="block text-[88px] md:text-[150px] text-outline italic ml-4">ಟಿಕ್</span>
</h1>
<p class="text-sm md:text-base text-gray-300 leading-relaxed max-w-md mb-12 opacity-90">
          ಉದ್ದೇಶದಿಂದ ನಿರ್ದೇಶಿಸಿ. ನಿಖರತೆಯಿಂದ ಬಣ್ಣ ಸಂಯೋಜಿಸಿ. ಸಿನಿಮಾದ ಭಾಷೆಯನ್ನು ಕಲಿಯಿರಿ — ಪೂರ್ವ-ನಿರ್ಮಾಣದಿಂದ ಪ್ರೇಕ್ಷಕರ ಹೃದಯವನ್ನು ಕಲಕುವ ಅಂತಿಮ ಕಟ್‌ವರೆಗೆ.
        </p>
<!-- CTA Button -->
<button class="glass-button pl-8 pr-3 py-3 rounded-full flex items-center gap-6 group hover:scale-105 transform transition-all">
<span class="text-xs font-bold tracking-[0.2em] uppercase">ಇಂದೇ ಸೇರಿ</span>
<div class="w-10 h-10 bg-brand-orange rounded-full flex items-center justify-center glow-orange">
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg>
</div>
</button>
</div>
<!-- Right Overlay Elements -->
<div class="absolute right-0 top-1/2 -translate-y-1/2 text-right hidden lg:block">
<!-- Pagination Numbering -->
<div class="flex items-baseline justify-end font-serif mb-12">
<span class="text-[120px] big-number-accent leading-none">03</span>
<span class="text-[60px] text-gray-600 mx-4 font-sans font-light">/</span>
<span class="text-[120px] big-number-muted leading-none">03</span>
</div>
<!-- Sidebar Slogan -->
<div class="space-y-4 pr-4">
<p class="font-serif italic text-xl text-gray-300">ಒಂದು ಫ್ರೇಮ್,<br/>ಒಂದು ಕಥೆ,<br/>ಅನಂತ ಪ್ರಭಾವ</p>
<a class="inline-block text-[10px] tracking-[0.2em] uppercase text-brand-orange font-bold pt-4 hover:underline" href="#">
            ಇದನ್ನು ಸಿನಿಮ್ಯಾಟಿಕ್ ಮಾಡಿ
          </a>
</div>
</div>
</section>
<!-- END: HeroContent -->
<!-- BEGIN: FooterUI -->
<footer class="flex items-end justify-between z-10">
<!-- Timestamp -->
<div class="text-2xl font-light" data-purpose="video-timestamp">
        00:01
      </div>
<!-- Progress Indicators -->
<div class="flex gap-3 pb-2" data-purpose="slider-controls">
<div class="w-8 h-[2px] bg-white/20"></div>
<div class="w-8 h-[2px] bg-white/20"></div>
<div class="w-16 h-[2px] bg-brand-orange"></div>
</div>
<!-- Empty spacer for symmetry with timestamp -->
<div class="w-24"></div>
</footer>
<!-- END: FooterUI -->
</main>
<!-- END: MainContainer -->
</body>
</html>
