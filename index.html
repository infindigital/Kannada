<!DOCTYPE html>
<html class="h-full" lang="kn">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>ಕನ್ನಡವೇ ನಮ್ಮ ಉಸಿರು — ಕನ್ನಡ ಸಂಸ್ಕೃತಿ</title>
<!-- Self-hosted, CDN-free stylesheets (built with Tailwind + @fontsource) -->
<link href="assets/fonts.css" rel="stylesheet" />
<link href="assets/tailwind.css" rel="stylesheet" />
<style data-purpose="custom-typography">
    /* Gold gradient text for the emphasis line */
    .text-gold-gradient {
      background: linear-gradient(90deg, #ffd700 0%, #ffe66b 50%, #ffd700 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    /* Outlined text for large accent numbers */
    .big-number-gold {
      color: transparent;
      -webkit-text-stroke: 1px #ffd700;
    }
    .big-number-muted {
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
    }
    .letter-spacing-widest {
      letter-spacing: 0.2em;
    }
  </style>
<style data-purpose="layout-and-effects">
    /* Full-bleed background video of the Karnataka flag */
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    /* Cinematic darkening overlay so the text stays legible over the video */
    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(90deg, rgba(10, 10, 10, 0.90) 0%, rgba(10, 10, 10, 0.60) 45%, rgba(10, 10, 10, 0.25) 100%),
        linear-gradient(0deg, rgba(10, 10, 10, 0.80) 0%, rgba(10, 10, 10, 0.15) 40%, rgba(10, 10, 10, 0.40) 100%);
    }
    .glass-button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    .glass-button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 215, 0, 0.4);
    }
    .glow-red {
      box-shadow: 0 0 24px rgba(198, 40, 40, 0.5);
    }
    /* Vertical line accent for the section label */
    .accent-line::before {
      content: "";
      display: inline-block;
      width: 30px;
      height: 1px;
      background-color: #ffd700;
      vertical-align: middle;
      margin-right: 12px;
    }
  </style>
</head>
<body class="h-full m-0 p-0 bg-brand-dark text-white font-sans overflow-hidden">
<!-- BEGIN: MainContainer -->
<main class="relative h-full w-full flex flex-col justify-between p-8 md:p-12">
<!-- BEGIN: Background Video (Karnataka flag flying) -->
<video class="hero-video" autoplay muted loop playsinline data-purpose="hero-background-video">
<source src="assets/karnataka-flag.mp4" type="video/mp4" />
</video>
<div class="hero-overlay" aria-hidden="true"></div>
<!-- END: Background Video -->
<!-- BEGIN: Header -->
<header class="flex items-center justify-between z-10">
<!-- Hamburger Menu -->
<div class="cursor-pointer" data-purpose="navigation-menu">
<svg fill="none" height="14" viewbox="0 0 24 14" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M0 1H24" stroke="white" stroke-width="1.5"></path>
<path d="M0 7H16" stroke="white" stroke-width="1.5"></path>
<path d="M0 13H24" stroke="white" stroke-width="1.5"></path>
</svg>
</div>
<!-- Logo -->
<div class="flex items-center gap-3" data-purpose="brand-logo">
<div class="w-8 h-8 border-2 border-brand-gold flex items-center justify-center">
<div class="w-3 h-3 bg-brand-red"></div>
</div>
<span class="text-xl font-bold tracking-[0.3em] uppercase">ಕನ್ನಡ</span>
</div>
<!-- Auth Actions -->
<div class="flex items-center gap-8" data-purpose="auth-links">
<a class="text-xs font-semibold tracking-widest hover:text-brand-gold transition-colors" href="#">ಲಾಗಿನ್</a>
<a class="glass-button px-6 py-2 rounded-full text-xs font-semibold tracking-widest border border-white/20" href="#">ಸೇರಿಕೊಳ್ಳಿ</a>
</div>
</header>
<!-- END: Header -->
<!-- BEGIN: HeroContent -->
<section class="flex-grow flex items-center relative z-10">
<!-- Left Content -->
<div class="max-w-2xl z-10">
<div class="accent-line text-[10px] uppercase tracking-[0.2em] text-brand-gold mb-8 font-semibold">
          ಕರ್ನಾಟಕ · ನಾಡು ನುಡಿ ಸಂಸ್ಕೃತಿ
        </div>
<h1 class="font-serif leading-[1.05] mb-8">
<span class="block text-[40px] md:text-[64px] font-semibold">ನಮ್ಮ ನಡೆ ಕನ್ನಡದೆಡೆ,</span>
<span class="block text-[40px] md:text-[64px] font-bold text-gold-gradient">ಕನ್ನಡವೇ ನಮ್ಮ ಉಸಿರು</span>
</h1>
<p class="text-sm md:text-lg text-gray-200 leading-relaxed max-w-xl mb-12 opacity-95">
          ಕರ್ನಾಟಕದ ಭವ್ಯ ಸಂಸ್ಕೃತಿ, ನೆಲ, ಜಲ ಮತ್ತು ಭಾಷೆಯ ಉಳಿವಿಗಾಗಿ ನಿರಂತರ ಹೋರಾಟ. ನಮ್ಮ ಅಸ್ಮಿತೆಯನ್ನು ಉಳಿಸಿ ಬೆಳೆಸಲು ನಮ್ಮೊಂದಿಗೆ ಕೈಜೋಡಿಸಿ.
        </p>
<!-- CTA Button -->
<button class="glass-button pl-8 pr-3 py-3 rounded-full flex items-center gap-6 group hover:scale-105 transform transition-all">
<span class="text-xs font-bold tracking-[0.2em] uppercase">ಕೈಜೋಡಿಸಿ</span>
<div class="w-10 h-10 bg-brand-red rounded-full flex items-center justify-center glow-red">
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg>
</div>
</button>
</div>
<!-- Right Overlay Elements -->
<div class="absolute right-0 top-1/2 -translate-y-1/2 text-right hidden lg:block">
<!-- Sidebar Slogan -->
<div class="space-y-4 pr-4">
<p class="font-serif italic text-2xl text-gray-200">ಜೈ ಕರ್ನಾಟಕ,<br/>ಜೈ ಭುವನೇಶ್ವರಿ</p>
<a class="inline-block text-[10px] tracking-[0.2em] uppercase text-brand-gold font-bold pt-4 hover:underline" href="#">
            ನಮ್ಮ ಚಳವಳಿ ಸೇರಿ
          </a>
</div>
</div>
</section>
<!-- END: HeroContent -->
<!-- BEGIN: FooterUI -->
<footer class="flex items-end justify-between z-10">
<!-- Tagline -->
<div class="text-sm md:text-base font-light tracking-wide text-gray-300" data-purpose="hero-tagline">
        ನಾಡು · ನುಡಿ · ನೆಲ · ಜಲ
      </div>
<!-- Progress Indicators -->
<div class="flex gap-3 pb-2" data-purpose="slider-controls">
<div class="w-16 h-[2px] bg-brand-gold"></div>
<div class="w-8 h-[2px] bg-white/20"></div>
<div class="w-8 h-[2px] bg-white/20"></div>
</div>
<!-- Empty spacer for symmetry with tagline -->
<div class="w-24"></div>
</footer>
<!-- END: FooterUI -->
</main>
<!-- END: MainContainer -->
</body>
</html>
